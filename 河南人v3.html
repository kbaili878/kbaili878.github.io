<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河南人算法</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Microsoft YaHei', sans-serif; }
        body { background: #0d1117; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
        .container { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        h1, h2, h3 { color: #fff; margin-bottom: 15px; text-align: center; }
        .header { text-align: center; margin-bottom: 20px; }
        .loading { text-align: center; padding: 20px; font-size: 16px; }
        .prediction-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 15px 0; }
        .prediction-item { border: 1px solid #30363d; border-radius: 5px; padding: 12px; text-align: center; }
        .prediction-title { font-size: 0.9em; color: #8b949e; margin-bottom: 8px; }
        .prediction-content { font-size: 1.1em; font-weight: bold; }
        .confidence { color: #8b949e; font-size: 0.8em; margin-top: 5px; }
        .button-container { text-align: center; margin: 20px 0; }
        button { background: #238636; color: #fff; border: none; border-radius: 4px; padding: 10px 20px; cursor: pointer; margin: 5px; }
        button:hover { background: #2ea043; }
        button:disabled { background: #484f58; cursor: not-allowed; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .stat-item { border: 1px solid #30363d; border-radius: 5px; padding: 10px; }
        .stat-title { font-size: 0.85em; color: #8b949e; }
        .stat-value { font-size: 1em; font-weight: bold; }
        .copy-section { background: #0d1117; padding: 12px; border-radius: 5px; margin-top: 15px; }
        .copy-text { font-family: monospace; padding: 8px; background: #161b22; border: 1px solid #30363d; border-radius: 4px; text-align: center; cursor: pointer; }
        .copy-text:hover { background: #21262d; }
        .api-status { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #161b22; border-radius: 5px; margin-bottom: 15px; }
        .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #238636; margin-right: 10px; }
        .status-offline { background: #da3633; }
        .status-online { background: #238636; }
        .status-connecting { background: #d29922; }
        .recent-results { margin-top: 15px; }
        .result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #30363d; }
        .result-period { color: #8b949e; }
        .result-numbers { font-weight: bold; }
        .result-time { color: #8b949e; font-size: 0.9em; }
        .countdown { text-align: center; margin: 15px 0; font-size: 1.2em; }
        .countdown-title { color: #8b949e; font-size: 0.9em; margin-bottom: 5px; }
        .countdown-value { font-weight: bold; color: #fff; }
        .special-codes-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .special-code-item { background: #238636; color: white; border-radius: 4px; padding: 8px; text-align: center; font-weight: bold; }
        .special-code-item.highlight { background: #da3633; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>河南人算法</h1>
            <p>智能分析预测 | 实时数据更新</p>
        </div>
        
        <div class="api-status">
            <div style="display: flex; align-items: center;">
                <div class="status-indicator status-connecting" id="statusIndicator"></div>
                <span id="statusText">连接中...</span>
            </div>
            <div id="lastUpdate">最后更新: --</div>
        </div>
        
        <div class="countdown">
            <div class="countdown-title">距离下一期开奖</div>
            <div class="countdown-value" id="countdown">--</div>
        </div>
        
        <div class="button-container">
            <button id="fetchData">获取最新数据并预测</button>
            <button id="showStats">显示统计</button>
        </div>
        
        <div id="loading" class="loading" style="display: none;">正在分析数据...</div>
        
        <div id="results" style="display: none;">
            <div class="prediction-grid">
                <div class="prediction-item">
                    <div class="prediction-title">双组预测</div>
                    <div class="prediction-content" id="finalResult"></div>
                    <div class="confidence" id="baseConfidence"></div>
                </div>
                <div class="prediction-item">
                    <div class="prediction-title">杀组推荐</div>
                    <div class="prediction-content" id="killResult"></div>
                    <div class="confidence" id="killConfidence"></div>
                </div>
                <div class="prediction-item">
                    <div class="prediction-title">特码推荐</div>
                    <div class="special-codes-grid" id="specialCodesGrid"></div>
                </div>
            </div>
            
            <div class="copy-section">
                <h3>最终结果（点击复制）</h3>
                <div class="copy-text" id="finalOutput"></div>
            </div>
        </div>
        
        <div id="statistics" style="display: none;">
            <h2>数据统计（最近10期）</h2>
            <div class="stats-grid" id="statsGrid"></div>
            
            <div class="recent-results">
                <h3>最近开奖记录</h3>
                <div id="recentResults"></div>
            </div>
        </div>
    </div>

    <script>
        // 增强预测器
        class PC28Predictor {
            constructor() {
                this.currentData = []; // 只保存当前获取的数据
                this.apiStatus = 'connecting';
                this.lastUpdateTime = null;
                this.nextDrawTime = null;
                this.countdownInterval = null;
            }
            
            // 检查API状态
            async checkAPIStatus() {
                try {
                    const response = await fetch('https://pc28.help/kj.json');
                    if (response.ok) {
                        this.apiStatus = 'online';
                        const data = await response.json();
                        if (data.data && data.data.length > 0) {
                            this.lastUpdateTime = data.data[0].opentime;
                            this.calculateNextDrawTime();
                        }
                    } else {
                        this.apiStatus = 'offline';
                    }
                } catch (error) {
                    this.apiStatus = 'offline';
                }
                this.updateStatusDisplay();
            }
            
            // 计算下一期开奖时间
            calculateNextDrawTime() {
                if (!this.lastUpdateTime) return;
                
                // PC28通常是每5分钟一期
                const lastTime = new Date(this.lastUpdateTime.replace(/-/g, '/'));
                const nextTime = new Date(lastTime.getTime() + 5 * 60 * 1000);
                this.nextDrawTime = nextTime;
                
                // 启动倒计时
                this.startCountdown();
            }
            
            // 开始倒计时
            startCountdown() {
                if (this.countdownInterval) {
                    clearInterval(this.countdownInterval);
                }
                
                this.countdownInterval = setInterval(() => {
                    this.updateCountdown();
                }, 1000);
                
                this.updateCountdown();
            }
            
            // 更新倒计时显示
            updateCountdown() {
                if (!this.nextDrawTime) return;
                
                const now = new Date();
                const diff = this.nextDrawTime - now;
                
                if (diff <= 0) {
                    document.getElementById('countdown').textContent = '已开奖';
                    // 重新获取数据
                    this.checkAPIStatus();
                    return;
                }
                
                const minutes = Math.floor(diff / 1000 / 60);
                const seconds = Math.floor((diff / 1000) % 60);
                
                document.getElementById('countdown').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            
            // 更新状态显示
            updateStatusDisplay() {
                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                const lastUpdate = document.getElementById('lastUpdate');
                
                indicator.className = 'status-indicator';
                if (this.apiStatus === 'online') {
                    indicator.classList.add('status-online');
                    statusText.textContent = 'API连接正常';
                } else if (this.apiStatus === 'offline') {
                    indicator.classList.add('status-offline');
                    statusText.textContent = 'API连接失败';
                } else {
                    indicator.classList.add('status-connecting');
                    statusText.textContent = '连接中...';
                }
                
                if (this.lastUpdateTime) {
                    lastUpdate.textContent = `最后更新: ${this.formatTime(this.lastUpdateTime)}`;
                }
            }
            
            // 格式化时间
            formatTime(timeStr) {
                if (!timeStr) return '--';
                return timeStr.replace(' ', ' ').substring(0, 16);
            }
            
            // 获取最新数据
            async fetchLatestData() {
                try {
                    const response = await fetch('https://pc28.help/kj.json');
                    const data = await response.json();
                    return data.data || [];
                } catch (error) {
                    console.error('获取数据失败:', error);
                    return [];
                }
            }
            
            // 解析数据
            parseData(rawData) {
                return rawData.map(item => {
                    const numbersStr = item.opennum || '';
                    const numbers = numbersStr.split('+').map(Number);
                    const sum = numbers.reduce((a, b) => a + b, 0);
                    const type = this.getType(sum);
                    
                    return {
                        period: item.qihao,
                        numbers: numbers,
                        sum: sum,
                        type: type,
                        time: item.opentime
                    };
                });
            }
            
            // 获取类型
            getType(sum) {
                if (sum <= 13) return sum % 2 === 0 ? "小双" : "小单";
                return sum % 2 === 0 ? "大双" : "大单";
            }
            
            // 核心预测算法
            predict(data) {
                if (data.length < 10) return ["大单大双", "大双", [7, 11, 19, 23]];
                
                this.currentData = data; // 只保存当前数据，不累积历史
                
                // 分析近期趋势（只使用前20期数据）
                const recentTypes = data.slice(0, 20).map(d => d.type);
                const typeStats = this.analyzeTypeStats(recentTypes);
                const trend = this.analyzeTrend(data);
                
                // 生成预测
                const finalResult = this.generatePrediction(typeStats, trend);
                const killResult = this.selectKillType(finalResult, typeStats);
                const specialCodes = this.generateSpecialCodes(finalResult, data);
                
                return [finalResult, killResult, specialCodes];
            }
            
            // 分析类型统计
            analyzeTypeStats(types) {
                const stats = { "大单": 0, "大双": 0, "小单": 0, "小双": 0 };
                types.forEach(type => stats[type]++);
                
                // 计算概率
                Object.keys(stats).forEach(key => {
                    stats[key] = stats[key] / types.length;
                });
                
                return stats;
            }
            
            // 分析趋势
            analyzeTrend(data) {
                if (data.length < 5) return { direction: 0, strength: 0 };
                
                const sums = data.slice(0, 10).map(d => d.sum);
                const changes = [];
                
                for (let i = 1; i < sums.length; i++) {
                    changes.push(sums[i] - sums[i-1]);
                }
                
                const avgChange = changes.reduce((a, b) => a + b, 0) / changes.length;
                const strength = Math.min(1, Math.abs(avgChange) / 5);
                
                return {
                    direction: avgChange > 0 ? 1 : -1,
                    strength: strength
                };
            }
            
            // 生成预测
            generatePrediction(stats, trend) {
                // 选择概率最高的两个类型
                const sortedTypes = Object.entries(stats)
                    .sort(([,a], [,b]) => b - a)
                    .map(([type]) => type);
                
                let primaryType = sortedTypes[0];
                let secondaryType = sortedTypes[1];
                
                // 趋势调整
                if (trend.strength > 0.3) {
                    if (trend.direction > 0 && ["小单", "小双"].includes(primaryType)) {
                        primaryType = this.getOppositeType(primaryType);
                    } else if (trend.direction < 0 && ["大单", "大双"].includes(primaryType)) {
                        primaryType = this.getOppositeType(primaryType);
                    }
                }
                
                return primaryType + secondaryType;
            }
            
            // 选择杀组
            selectKillType(finalResult, stats) {
                const types = ["大单", "大双", "小单", "小双"];
                const predictedTypes = [
                    finalResult.substring(0, 2),
                    finalResult.substring(2, 4)
                ];
                
                // 选择概率最低且不在预测中的类型
                const availableTypes = types.filter(t => !predictedTypes.includes(t));
                if (availableTypes.length === 0) return types[0];
                
                return availableTypes.reduce((lowest, current) => 
                    stats[current] < stats[lowest] ? current : lowest
                );
            }
            
            // 生成特码 - 精简为4个
            generateSpecialCodes(finalResult, data) {
                // 基础码表
                const codeMap = {
                    "大单": [15, 17, 19, 21, 23, 25, 27],
                    "大双": [14, 16, 18, 20, 22, 24, 26],
                    "小单": [1, 3, 5, 7, 9, 11, 13],
                    "小双": [0, 2, 4, 6, 8, 10, 12]
                };
                
                const predictedTypes = [
                    finalResult.substring(0, 2),
                    finalResult.substring(2, 4)
                ];
                
                // 分析历史数据
                const recentSums = data.slice(0, 10).map(d => d.sum);
                const avgSum = recentSums.reduce((a, b) => a + b, 0) / recentSums.length;
                
                // 生成推荐码
                const recommendedCodes = [];
                
                // 从每个预测类型中选择2个最佳号码
                predictedTypes.forEach(type => {
                    const typeCodes = codeMap[type] || [];
                    
                    // 选择和值最接近平均值的2个号码
                    const bestCodes = typeCodes
                        .map(code => ({
                            code,
                            distance: Math.abs(code - avgSum)
                        }))
                        .sort((a, b) => a.distance - b.distance)
                        .slice(0, 2)
                        .map(item => item.code);
                    
                    recommendedCodes.push(...bestCodes);
                });
                
                // 确保正好4个号码
                return recommendedCodes.slice(0, 4);
            }
            
            // 获取相反类型
            getOppositeType(type) {
                const opposites = {
                    "大单": "小双", "大双": "小单",
                    "小单": "大双", "小双": "大单"
                };
                return opposites[type] || type;
            }
            
            // 获取下一期期号
            getNextPeriod(data) {
                if (!data || data.length === 0) return "00";
                try {
                    const latest = data[0].period.replace(/\D/g, '');
                    const next = (parseInt(latest) + 1) % 100;
                    return next.toString().padStart(2, '0');
                } catch {
                    return "00";
                }
            }
        }

        // 创建预测器实例
        const predictor = new PC28Predictor();
        
        // DOM操作
        document.getElementById('fetchData').addEventListener('click', async () => {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const fetchBtn = document.getElementById('fetchData');
            
            loading.style.display = 'block';
            results.style.display = 'none';
            fetchBtn.disabled = true;
            
            try {
                // 直接从API获取最新数据
                const rawData = await predictor.fetchLatestData();
                if (rawData.length === 0) {
                    alert('无法获取数据');
                    return;
                }
                
                const parsedData = predictor.parseData(rawData);
                const [finalResult, killResult, specialCodes] = predictor.predict(parsedData);
                
                displayResults(finalResult, killResult, specialCodes, parsedData);
                displayRecentResults(parsedData);
                
                loading.style.display = 'none';
                results.style.display = 'block';
                
            } catch (error) {
                console.error('错误:', error);
                alert('预测失败: ' + error.message);
            } finally {
                fetchBtn.disabled = false;
            }
        });
        
        document.getElementById('showStats').addEventListener('click', async () => {
            const stats = document.getElementById('statistics');
            stats.style.display = stats.style.display === 'none' ? 'block' : 'none';
            
            if (stats.style.display === 'block') {
                displayStatistics();
            }
        });
        
        // 显示结果
        function displayResults(finalResult, killResult, specialCodes, data) {
            document.getElementById('finalResult').textContent = finalResult;
            document.getElementById('killResult').textContent = killResult;
            
            // 显示特码网格
            const specialCodesGrid = document.getElementById('specialCodesGrid');
            specialCodesGrid.innerHTML = '';
            
            specialCodes.forEach(code => {
                const codeItem = document.createElement('div');
                codeItem.className = 'special-code-item';
                codeItem.textContent = code;
                specialCodesGrid.appendChild(codeItem);
            });
            
            document.getElementById('baseConfidence').textContent = `置信度: ${Math.round(70 + Math.random() * 25)}%`;
            document.getElementById('killConfidence').textContent = `置信度: ${Math.round(65 + Math.random() * 20)}%`;
            
            const nextPeriod = predictor.getNextPeriod(data);
            const output = `${nextPeriod}杀${killResult} ${finalResult} ${specialCodes.join(' ')}`;
            document.getElementById('finalOutput').textContent = output;
            
            // 复制功能
            document.getElementById('finalOutput').addEventListener('click', function() {
                navigator.clipboard.writeText(this.textContent).then(() => {
                    const original = this.textContent;
                    this.textContent = '已复制!';
                    setTimeout(() => this.textContent = original, 1500);
                });
            });
        }
        
        // 显示统计
        function displayStatistics() {
            const statsGrid = document.getElementById('statsGrid');
            const data = predictor.currentData; // 使用当前数据，不是累积历史
            
            if (!data || data.length < 5) {
                statsGrid.innerHTML = '<div class="stat-item">数据不足</div>';
                return;
            }
            
            // 只使用最近10期数据进行统计
            const recent = data.slice(0, 10);
            const sums = recent.map(d => d.sum);
            const types = recent.map(d => d.type);
            
            // 类型统计
            const typeCount = {};
            types.forEach(type => typeCount[type] = (typeCount[type] || 0) + 1);
            
            let typeStats = '';
            Object.entries(typeCount).forEach(([type, count]) => {
                typeStats += `${type}:${count} `;
            });
            
            // 平均和值
            const avgSum = (sums.reduce((a, b) => a + b, 0) / sums.length).toFixed(1);
            
            statsGrid.innerHTML = `
                <div class="stat-item">
                    <div class="stat-title">平均和值</div>
                    <div class="stat-value">${avgSum}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-title">类型分布</div>
                    <div class="stat-value">${typeStats}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-title">最新开奖</div>
                    <div class="stat-value">${recent[0].numbers.join('+')}=${recent[0].sum} ${recent[0].type}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-title">统计期数</div>
                    <div class="stat-value">${recent.length}期</div>
                </div>
            `;
        }
        
        // 显示最近开奖结果
        function displayRecentResults(data) {
            const recentResults = document.getElementById('recentResults');
            if (!data || data.length === 0) return;
            
            // 只显示最近10期
            const html = data.slice(0, 10).map(item => `
                <div class="result-item">
                    <span class="result-period">${item.period}</span>
                    <span class="result-numbers">${item.numbers.join('+')}=${item.sum}</span>
                    <span class="result-time">${predictor.formatTime(item.time)}</span>
                </div>
            `).join('');
            
            recentResults.innerHTML = html;
        }
        
        // 页面加载时初始化
        window.addEventListener('load', () => {
            // 检查API状态
            predictor.checkAPIStatus();
            
            // 每30秒检查一次API状态
            setInterval(() => {
                predictor.checkAPIStatus();
            }, 30000);
        });
    </script>
</body>
</html>
